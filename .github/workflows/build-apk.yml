name: APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projektverzeichnis suchen
        id: finde
        run: |
          echo "--- Inhalt des Hauptverzeichnisses ---"
          ls -la
          DIR=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "FEHLER: Keine settings.gradle.kts im Repository gefunden."
            exit 1
          fi
          echo "Projekt gefunden in: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Debug-APK bauen
        working-directory: ${{ steps.finde.outputs.dir }}
        run: gradle assembleDebug

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AnrufKarte-apk
          path: ${{ steps.finde.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
