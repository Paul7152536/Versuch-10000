name: APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Entpacken und bauen
        run: |
          echo "--- Vorher ---"
          ls -la
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Entpacke $z"
              unzip -oq "$z"
            fi
          done
          echo "--- Nachher ---"
          ls -la
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AnrufKarte-apk
          path: app/build/outputs/apk/debug/app-debug.apk
