name: APK bauen
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: ZIP automatisch entpacken
        run: |
          ls -la
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*"); do
            echo "ZIP gefunden: $z ($(stat -c%s "$z") Bytes)"
            unzip -oq "$z" -d . || echo "FEHLER beim Entpacken"
          done
      - name: Projektverzeichnis suchen
        id: finde
        run: |
          ls -la
          DIR=$(find . -name "settings.gradle.kts" -not -path "*/build/*" | head -n 1 | xargs -r dirname)
          if [ -z "$DIR" ]; then echo "FEHLER: nicht gefunden"; exit 1; fi
          echo "Projekt gefunden in: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT
      - name: Debug-APK bauen
        working-directory: ${{ steps.finde.outputs.dir }}
        run: gradle assembleDebug
      - u
